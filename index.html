<!DOCTYPE html>
<html lang="si">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Transfer Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #101820;
    --panel: #16202B;
    --panel-alt: #1C2833;
    --border: #263340;
    --text: #E7ECF1;
    --text-dim: #8CA0B3;
    --accent: #3FB6AC;
    --accent-dim: #2A7D76;
    --warn: #E0A458;
    --danger: #D96B5D;
  }

  * { box-sizing: border-box; }

  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(14px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes popIn {
    from { opacity: 0; transform: scale(0.92) translateY(-4px); }
    to { opacity: 1; transform: scale(1) translateY(0); }
  }
  @keyframes glowPulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(63,182,172,0.0); }
    50% { box-shadow: 0 0 0 6px rgba(63,182,172,0.06); }
  }
  @keyframes drift {
    0%   { transform: translate(0, 0) scale(1); }
    50%  { transform: translate(-3%, 2%) scale(1.08); }
    100% { transform: translate(0, 0) scale(1); }
  }
  @keyframes spin {
    to { transform: rotate(360deg); }
  }
  @keyframes shimmer {
    0% { background-position: -200% 0; }
    100% { background-position: 200% 0; }
  }
  @keyframes codeDigitIn {
    from { opacity: 0; transform: translateY(6px) scale(0.85); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition-duration: 0.001ms !important; }
  }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    font-family: 'Inter', sans-serif;
    color: var(--text);
    display: flex;
    justify-content: center;
    padding: 48px 20px;
    position: relative;
    overflow-x: hidden;
  }

  body::before {
    content: "";
    position: fixed;
    inset: -10%;
    z-index: 0;
    pointer-events: none;
    background:
      radial-gradient(circle at 20% 25%, rgba(63,182,172,0.10), transparent 40%),
      radial-gradient(circle at 82% 70%, rgba(63,182,172,0.06), transparent 45%);
    animation: drift 16s ease-in-out infinite;
  }

  .console {
    width: 100%;
    max-width: 640px;
    position: relative;
    z-index: 1;
  }

  .console-header {
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 28px;
  }

  .brand-title {
    font-size: 26px;
    font-weight: 700;
    margin: 0;
    letter-spacing: 0.06em;
    color: var(--accent);
    text-align: center;
    animation: fadeInUp 0.5s ease both;
  }

  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    animation: fadeInUp 0.5s ease both;
    transition: border-color 0.25s ease, box-shadow 0.25s ease;
  }
  .console > .panel:nth-of-type(1) { animation-delay: 0.06s; }
  .console > .panel:nth-of-type(2) { animation-delay: 0.14s; }
  .console > .panel:nth-of-type(3) { animation-delay: 0.22s; }
  .panel:hover { border-color: rgba(63,182,172,0.35); }

  .panel + .panel { margin-top: 16px; }

  .panel-inner { padding: 24px; }

  #dropzone {
    border: 1.5px dashed var(--border);
    border-radius: 8px;
    padding: 32px 20px;
    text-align: center;
    cursor: pointer;
    transition: border-color 0.2s ease, background 0.2s ease, transform 0.2s ease;
  }
  #dropzone.drag {
    border-color: var(--accent);
    background: rgba(63,182,172,0.06);
    transform: scale(1.015);
  }
  #dropzone:hover { border-color: var(--accent-dim); transform: translateY(-2px); }

  #dropzone svg {
    width: 28px;
    height: 28px;
    margin-bottom: 12px;
    stroke: var(--text-dim);
    transition: stroke 0.2s ease, transform 0.2s ease;
  }
  #dropzone:hover svg { stroke: var(--accent); transform: translateY(-2px); }
  #dropzone.drag svg { stroke: var(--accent); animation: fadeInUp 0.5s ease infinite alternate; }

  #dropzone .dz-main {
    font-size: 14px;
    font-weight: 500;
    margin: 0 0 4px;
    color: var(--text);
  }
  #dropzone .dz-sub {
    font-size: 12.5px;
    color: var(--text-dim);
    margin: 0;
  }
  #dropzone .dz-sub b { color: var(--text-dim); font-weight: 600; }

  #fileInput { display: none; }

  .chosen {
    display: none;
    margin-top: 14px;
    padding: 12px 14px;
    background: var(--panel-alt);
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 12.5px;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    font-family: 'JetBrains Mono', monospace;
  }
  .chosen.show { display: flex; animation: popIn 0.25s ease both; }
  .chosen .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chosen .size { color: var(--text-dim); flex-shrink: 0; }

  button.send {
    flex: 1;
    padding: 12px;
    background: var(--accent);
    color: #08201D;
    border: none;
    border-radius: 6px;
    font-family: 'Inter', sans-serif;
    font-size: 13.5px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s ease, transform 0.15s ease, box-shadow 0.15s ease;
  }
  button.send:hover:not(:disabled) { background: #52c4ba; transform: translateY(-1px); box-shadow: 0 6px 16px rgba(63,182,172,0.25); }
  button.send:active:not(:disabled) { transform: translateY(0) scale(0.98); box-shadow: none; }
  button.send:disabled { background: var(--border); color: var(--text-dim); cursor: not-allowed; }

  .btn-spinner {
    display: inline-block;
    width: 12px;
    height: 12px;
    border: 2px solid rgba(8,32,29,0.35);
    border-top-color: #08201D;
    border-radius: 50%;
    animation: spin 0.6s linear infinite;
    vertical-align: -2px;
    margin-right: 2px;
  }

  .target-code-input {
    width: 100%;
    margin-top: 12px;
    padding: 12px 14px;
    background: var(--panel-alt);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    font-size: 15px;
    letter-spacing: 0.1em;
    text-align: center;
    transition: border-color 0.2s ease, box-shadow 0.2s ease;
  }
  .target-code-input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(63,182,172,0.14); }
  .target-code-input::placeholder { letter-spacing: normal; color: var(--text-dim); }

  .btn-row {
    display: flex;
    gap: 10px;
    margin-top: 16px;
  }

  .clear-btn {
    padding: 12px 18px;
    background: transparent;
    color: var(--text-dim);
    border: 1px solid var(--border);
    border-radius: 6px;
    font-family: 'Inter', sans-serif;
    font-size: 13.5px;
    font-weight: 600;
    cursor: pointer;
    transition: border-color 0.15s ease, color 0.15s ease, transform 0.15s ease;
  }
  .clear-btn:hover:not(:disabled) { border-color: var(--danger); color: var(--danger); transform: translateY(-1px); }
  .clear-btn:active:not(:disabled) { transform: translateY(0) scale(0.97); }
  .clear-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  #status {
    margin-top: 14px;
    font-size: 12.5px;
    line-height: 1.6;
    display: none;
    padding: 12px 14px;
    border-radius: 6px;
    word-break: break-word;
    font-family: 'JetBrains Mono', monospace;
  }
  #status.show { display: block; animation: fadeInUp 0.3s ease both; }
  #status.ok { background: rgba(63,182,172,0.1); color: var(--accent); border: 1px solid rgba(63,182,172,0.3); }
  #status.err { background: rgba(217,107,93,0.1); color: var(--danger); border: 1px solid rgba(217,107,93,0.3); }
  #status.pending { background: var(--panel-alt); color: var(--text-dim); border: 1px solid var(--border); }
  #status a { color: inherit; font-weight: 600; }

  .panel-title-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 24px;
    border-bottom: 1px solid var(--border);
  }
  .panel-title-row h2 {
    font-size: 13px;
    font-weight: 600;
    margin: 0;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--text-dim);
  }
  .panel-title-row .count {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--text-dim);
  }

  table { width: 100%; border-collapse: collapse; table-layout: fixed; }
  thead th {
    text-align: left;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--text-dim);
    padding: 10px 24px;
    font-weight: 500;
    border-bottom: 1px solid var(--border);
  }
  thead th.num { text-align: right; }
  thead th:first-child { width: 42%; }
  thead th:nth-child(2) { width: 16%; }
  thead th:last-child { width: 42%; }
  tbody td {
    padding: 12px 24px;
    font-size: 13px;
    border-bottom: 1px solid var(--border);
    vertical-align: middle;
  }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr { animation: fadeInUp 0.35s ease both; transition: background 0.2s ease; }
  tbody tr:hover { background: var(--panel-alt); }

  .file-name {
    display: flex;
    align-items: center;
    gap: 10px;
    overflow: hidden;
    min-width: 0;
  }
  .file-name svg { width: 15px; height: 15px; stroke: var(--text-dim); flex-shrink: 0; }
  .file-name span {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12.5px;
    min-width: 0;
    flex: 1;
  }

  td.size, td.action {
    text-align: right;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--text-dim);
    white-space: nowrap;
  }

  td.action a {
    color: var(--accent);
    text-decoration: none;
    font-weight: 600;
  }
  td.action a:hover { text-decoration: underline; }

  .empty-row td {
    text-align: center;
    color: var(--text-dim);
    font-style: italic;
    padding: 28px 24px;
  }

  /* Share code box (shown after a successful upload) */
  .code-box {
    display: none;
    margin-top: 14px;
    padding: 18px;
    background: var(--panel-alt);
    border: 1px solid var(--accent-dim);
    border-radius: 8px;
    text-align: center;
    animation: glowPulse 3.5s ease-in-out infinite;
  }
  .code-box.show { display: block; }
  .code-box .code-label {
    font-size: 12px;
    color: var(--text-dim);
    margin-bottom: 10px;
  }
  .code-box .code-value {
    font-family: 'JetBrains Mono', monospace;
    font-size: 32px;
    font-weight: 600;
    letter-spacing: 0.15em;
    color: var(--accent);
    margin-bottom: 12px;
  }
  .code-box .code-value span {
    display: inline-block;
    animation: codeDigitIn 0.4s ease both;
  }
  .code-actions {
    display: flex;
    gap: 8px;
    justify-content: center;
  }
  .mini-btn {
    padding: 8px 14px;
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 6px;
    font-family: 'Inter', sans-serif;
    font-size: 12.5px;
    font-weight: 500;
    cursor: pointer;
    transition: border-color 0.15s ease, background 0.15s ease;
  }
  .mini-btn:hover { border-color: var(--accent); background: rgba(63,182,172,0.08); }
  .mini-btn.copied {
    border-color: var(--accent);
    background: var(--accent);
    color: #08201D;
    animation: popIn 0.3s ease;
  }

  /* Receive panel */
  .receive-row {
    display: flex;
    gap: 10px;
  }
  #codeInput {
    flex: 1;
    padding: 12px 14px;
    background: var(--panel-alt);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    font-size: 15px;
    letter-spacing: 0.1em;
    text-align: center;
  }
  #codeInput:focus { outline: none; border-color: var(--accent); }
  #codeInput::placeholder { letter-spacing: normal; color: var(--text-dim); }

  button.send.secondary {
    width: auto;
    margin-top: 0;
    padding: 12px 20px;
    white-space: nowrap;
  }

  #receiveStatus {
    margin-top: 14px;
    font-size: 12.5px;
    line-height: 1.6;
    display: none;
    padding: 12px 14px;
    border-radius: 6px;
    word-break: break-word;
    font-family: 'JetBrains Mono', monospace;
  }
  #receiveStatus.show { display: block; }
  #receiveStatus.ok { background: rgba(63,182,172,0.1); color: var(--accent); border: 1px solid rgba(63,182,172,0.3); }
  #receiveStatus.err { background: rgba(217,107,93,0.1); color: var(--danger); border: 1px solid rgba(217,107,93,0.3); }
  #receiveStatus.pending { background: var(--panel-alt); color: var(--text-dim); border: 1px solid var(--border); }
  #receiveStatus a { color: inherit; font-weight: 600; }

  /* Row action buttons in the History table */
  td.action { display: flex; align-items: center; justify-content: flex-end; gap: 12px; }
  .icon-btn {
    background: none;
    border: none;
    padding: 0;
    color: var(--text-dim);
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
  }
  .icon-btn:hover { color: var(--text); }
  .icon-btn.danger:hover { color: var(--danger); }

  /* Share popup menu - WhatsApp / Facebook / Telegram options */
  .share-menu {
    position: fixed;
    z-index: 999;
    background: var(--panel-alt);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 6px;
    display: flex;
    flex-direction: column;
    min-width: 170px;
    box-shadow: 0 10px 28px rgba(0,0,0,0.45);
    animation: popIn 0.18s ease both;
  }
  .share-menu a {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 10px;
    border-radius: 6px;
    color: var(--text);
    text-decoration: none;
    font-size: 13px;
    font-family: 'Inter', sans-serif;
    transition: background 0.15s ease, transform 0.15s ease;
  }
  .share-menu a:hover { background: var(--panel); transform: translateX(2px); }
  .share-icon {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 10px;
    font-weight: 700;
    color: #fff;
    flex-shrink: 0;
  }
  .share-icon.wa { background: #25D366; }
  .share-icon.fb { background: #1877F2; }
  .share-icon.tg { background: #229ED9; }

  @media (max-width: 480px) {
    .panel-inner { padding: 18px; }
    thead th, tbody td, .panel-title-row { padding-left: 16px; padding-right: 16px; }
    thead th:nth-child(2), td.size { display: none; }
    .receive-row { flex-direction: column; }
  }
</style>
</head>
<body>

<div class="console">
  <div class="console-header">
    <h1 class="brand-title">FILE-X</h1>
  </div>

  <div class="panel">
    <div class="panel-inner code-box show" id="codeBox">
      <div class="code-label">Your code — give this to anyone sending you a file</div>
      <div class="code-value" id="codeValue">----</div>
      <div class="code-actions">
        <button class="mini-btn" id="copyCodeBtn">Copy Code</button>
        <button class="mini-btn" id="shareCodeBtn">Share</button>
      </div>
    </div>
  </div>

  <div class="panel">
    <div class="panel-inner">
      <div id="dropzone">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 16V4M12 4l-4 4M12 4l4 4"/>
          <path d="M4 16v2a2 2 0 002 2h12a2 2 0 002-2v-2"/>
        </svg>
        <p class="dz-main">Drop a file here or click to browse</p>
        <p class="dz-sub">Any file type · up to <b>100 MB</b></p>
        <input type="file" id="fileInput">
      </div>

      <div class="chosen" id="chosen">
        <span class="name" id="chosenName"></span>
        <span class="size" id="chosenSize"></span>
      </div>

      <input type="text" id="targetCodeInput" maxlength="4" inputmode="numeric" placeholder="Send to code (4 digits)" class="target-code-input">

      <div class="btn-row">
        <button class="send" id="sendBtn" disabled>Upload File</button>
        <button class="clear-btn" id="clearBtn" disabled>Clear</button>
      </div>

      <div id="status"></div>
    </div>
  </div>

  <div class="panel">
    <div class="panel-title-row">
      <h2>History</h2>
      <span class="count" id="fileCount">0 files</span>
    </div>
    <table>
      <thead>
        <tr>
          <th>File</th>
          <th class="num">Size</th>
          <th class="num">Actions</th>
        </tr>
      </thead>
      <tbody id="fileList">
        <tr class="empty-row"><td colspan="3">Loading…</td></tr>
      </tbody>
    </table>
  </div>
</div>

<script>
const API = 'https://file-x-serve-production.up.railway.app';
const dropzone = document.getElementById('dropzone');
const fileInput = document.getElementById('fileInput');
const chosen = document.getElementById('chosen');
const chosenName = document.getElementById('chosenName');
const chosenSize = document.getElementById('chosenSize');
const targetCodeInput = document.getElementById('targetCodeInput');
const sendBtn = document.getElementById('sendBtn');
const clearBtn = document.getElementById('clearBtn');
const status = document.getElementById('status');
const fileList = document.getElementById('fileList');
const fileCount = document.getElementById('fileCount');
const codeBox = document.getElementById('codeBox');
const codeValue = document.getElementById('codeValue');
const copyCodeBtn = document.getElementById('copyCodeBtn');
const shareCodeBtn = document.getElementById('shareCodeBtn');

let selectedFile = null;
let myCode = null; // mema device ekatama thiyena, wenas nowena code eka

function formatSize(bytes) {
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
  return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
}

function fileIconSvg() {
  return '<svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><path d="M14 2v6h6"/></svg>';
}

function setStatus(kind, html) {
  status.className = 'show ' + kind;
  status.innerHTML = html;
}

function updateSendButtonState() {
  const codeValid = /^\d{4}$/.test(targetCodeInput.value.trim());
  sendBtn.disabled = !(selectedFile && codeValid);
}

function selectFile(file) {
  selectedFile = file;
  chosenName.textContent = file.name;
  chosenSize.textContent = formatSize(file.size);
  chosen.classList.add('show');
  clearBtn.disabled = false;
  status.classList.remove('show');
  updateSendButtonState();
}

function resetSelection() {
  selectedFile = null;
  fileInput.value = '';
  chosen.classList.remove('show');
  clearBtn.disabled = true;
  status.classList.remove('show');
  updateSendButtonState();
}

targetCodeInput.addEventListener('input', updateSendButtonState);

clearBtn.addEventListener('click', resetSelection);

dropzone.addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', (e) => {
  if (e.target.files.length) selectFile(e.target.files[0]);
});

['dragenter', 'dragover'].forEach(evt => {
  dropzone.addEventListener(evt, (e) => {
    e.preventDefault();
    dropzone.classList.add('drag');
  });
});
['dragleave', 'drop'].forEach(evt => {
  dropzone.addEventListener(evt, (e) => {
    e.preventDefault();
    dropzone.classList.remove('drag');
  });
});
dropzone.addEventListener('drop', (e) => {
  if (e.dataTransfer.files.length) selectFile(e.dataTransfer.files[0]);
});

sendBtn.addEventListener('click', async () => {
  if (!selectedFile) return;
  const targetCode = targetCodeInput.value.trim();
  if (!/^\d{4}$/.test(targetCode)) {
    setStatus('err', '✕ Digits 4ක code එකක් "Send to code" එකට දාන්න.');
    return;
  }

  sendBtn.disabled = true;
  sendBtn.innerHTML = '<span class="btn-spinner"></span> Uploading…';
  setStatus('pending', 'Transferring file…');

  const formData = new FormData();
  formData.append('file', selectedFile);
  formData.append('targetCode', targetCode);

  try {
    const res = await fetch(API + '/upload', { method: 'POST', body: formData });
    const data = await res.json();

    if (data.success) {
      setStatus('ok', '✓ Sent to code ' + data.file.targetCode + ' — ' + data.file.originalName + ' (' + formatSize(data.file.size) + ')');
      chosen.classList.remove('show');
      selectedFile = null;
      fileInput.value = '';
      clearBtn.disabled = true;
      targetCodeInput.value = '';
      updateSendButtonState();

      if (targetCode === myCode) loadFileList();
    } else {
      setStatus('err', '✕ ' + (data.message || 'Upload failed'));
    }
  } catch (err) {
    setStatus('err', '✕ Could not reach the server.');
  } finally {
    sendBtn.textContent = 'Upload File';
    updateSendButtonState();
  }
});

copyCodeBtn.addEventListener('click', async () => {
  if (!myCode) return;
  try {
    await navigator.clipboard.writeText(myCode);
    copyCodeBtn.textContent = 'Copied!';
    copyCodeBtn.classList.add('copied');
    setTimeout(() => {
      copyCodeBtn.textContent = 'Copy Code';
      copyCodeBtn.classList.remove('copied');
    }, 1500);
  } catch (e) {
    prompt('Copy this code:', myCode);
  }
});

shareCodeBtn.addEventListener('click', (e) => {
  if (!myCode) return;
  const message = 'FILE-X eken mata file ekak yawanna, mema code eka use karanna: ' + myCode;
  openShareMenu(e.currentTarget, API, message);
});

// WhatsApp / Facebook / Telegram share links hadanawa
function buildShareLinks(url, text) {
  const encodedUrl = encodeURIComponent(url);
  const encodedText = encodeURIComponent(text);
  return {
    whatsapp: 'https://wa.me/?text=' + encodedText + '%20' + encodedUrl,
    facebook: 'https://www.facebook.com/sharer/sharer.php?u=' + encodedUrl,
    telegram: 'https://t.me/share/url?url=' + encodedUrl + '&text=' + encodedText
  };
}

// Share button click una nam, WhatsApp/Facebook/Telegram 3ma pennana popup ekak open karanawa
function openShareMenu(anchorEl, url, text) {
  closeShareMenu();
  const links = buildShareLinks(url, text);

  const menu = document.createElement('div');
  menu.className = 'share-menu';
  menu.id = 'activeShareMenu';
  menu.innerHTML =
    '<a href="' + links.whatsapp + '" target="_blank" rel="noopener"><span class="share-icon wa">W</span>WhatsApp</a>' +
    '<a href="' + links.facebook + '" target="_blank" rel="noopener"><span class="share-icon fb">f</span>Facebook</a>' +
    '<a href="' + links.telegram + '" target="_blank" rel="noopener"><span class="share-icon tg">T</span>Telegram</a>';
  document.body.appendChild(menu);

  const rect = anchorEl.getBoundingClientRect();
  const menuWidth = menu.offsetWidth;
  const menuHeight = menu.offsetHeight;

  // Pahala space nathi welawe, button eke udinma menu eka open karanawa
  const spaceBelow = window.innerHeight - rect.bottom;
  if (spaceBelow < menuHeight + 12) {
    menu.style.top = (rect.top - menuHeight - 6) + 'px';
  } else {
    menu.style.top = (rect.bottom + 6) + 'px';
  }

  menu.style.left = Math.max(8, Math.min(rect.left, window.innerWidth - menuWidth - 8)) + 'px';

  setTimeout(() => document.addEventListener('click', closeShareMenuOnOutsideClick), 0);
}

function closeShareMenu() {
  const existing = document.getElementById('activeShareMenu');
  if (existing) existing.remove();
  document.removeEventListener('click', closeShareMenuOnOutsideClick);
}

function closeShareMenuOnOutsideClick(e) {
  const menu = document.getElementById('activeShareMenu');
  if (menu && !menu.contains(e.target)) closeShareMenu();
}

async function deleteFile(key) {
  if (!confirm('Mema file eka delete karannada? Meka undo karanna bahae.')) return;
  try {
    const res = await fetch(API + '/delete/' + myCode + '/' + encodeURIComponent(key), { method: 'DELETE' });
    const data = await res.json();
    if (data.success) {
      loadFileList();
    } else {
      alert(data.message);
    }
  } catch (err) {
    alert('File එක delete කරන්න බැරි වුනා.');
  }
}

async function loadFileList() {
  if (!myCode) return;
  try {
    const res = await fetch(API + '/inbox/' + myCode);
    const data = await res.json();

    fileCount.textContent = data.count + (data.count === 1 ? ' file' : ' files');

    if (!data.files || data.files.length === 0) {
      fileList.innerHTML = '<tr class="empty-row"><td colspan="3">No files received yet</td></tr>';
      return;
    }

    fileList.innerHTML = data.files.map((f, i) => {
      const fullUrl = API + f.downloadUrl; // relative path eka + domain eka = real, share karanna puluwan URL ekak
      return (
        '<tr style="animation-delay:' + Math.min(i * 0.05, 0.4) + 's">' +
          '<td><div class="file-name">' + fileIconSvg() + '<span>' + f.name + '</span></div></td>' +
          '<td class="size">' + formatSize(f.size) + '</td>' +
          '<td class="action">' +
            '<button class="icon-btn" data-action="share" data-url="' + fullUrl + '" data-name="' + f.name.replace(/"/g, '&quot;') + '">Share</button>' +
            '<a href="' + fullUrl + '" target="_blank">Download</a>' +
            '<button class="icon-btn danger" data-action="delete" data-key="' + f.key.replace(/"/g, '&quot;') + '">Delete</button>' +
          '</td>' +
        '</tr>'
      );
    }).join('');
  } catch (err) {
    fileCount.textContent = '—';
    fileList.innerHTML = '<tr class="empty-row"><td colspan="3">Server not reachable</td></tr>';
  }
}

// History table eke "Share" / "Delete" buttons walata click event delegation
fileList.addEventListener('click', (e) => {
  const btn = e.target.closest('button[data-action]');
  if (!btn) return;

  if (btn.dataset.action === 'delete') {
    deleteFile(btn.dataset.key);
  } else if (btn.dataset.action === 'share') {
    openShareMenu(btn, btn.dataset.url, 'File: ' + btn.dataset.name);
  }
});

// Code eke digit ekak ekak stagger ekak widihata animate karala pennanawa
function renderCode(code) {
  codeValue.innerHTML = code.split('').map((ch, i) =>
    '<span style="animation-delay:' + (i * 0.06) + 's">' + ch + '</span>'
  ).join('');
}

// Mema device ekatama thiyena code eka hoyaganna - localStorage eke
// kalin save karapu ekak thiyenawada balala, ehema nathnam aluth ekak illanawa.
async function initMyCode() {
  const savedCode = localStorage.getItem('fileXCode');

  if (savedCode) {
    try {
      const checkRes = await fetch(API + '/check-code/' + savedCode);
      const checkData = await checkRes.json();
      if (checkData.success && checkData.exists) {
        myCode = savedCode;
        renderCode(myCode);
        loadFileList();
        return;
      }
    } catch (err) {
      // server eka reach wenne naha nam pahalata yai, aluth code ekak illanawa
    }
  }

  try {
    const res = await fetch(API + '/register', { method: 'POST' });
    const data = await res.json();
    if (data.success) {
      myCode = data.code;
      localStorage.setItem('fileXCode', myCode);
      renderCode(myCode);
      loadFileList();
    }
  } catch (err) {
    codeValue.textContent = '----';
  }
}

initMyCode();

// Wenath kenek file ekak yawuwoth, page eka refresh nokarama penena widihata
// tatpara 5 kata parak automatic widihata inbox eka check karanawa.
setInterval(() => {
  if (myCode) loadFileList();
}, 5000);
</script>
